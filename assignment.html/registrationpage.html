<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Page</title>
</head>
<body>
    <h2>Student Registration</h2>
    <!-- The form submits and redirects to the login page -->
    <form action="loginpage.html" method="get">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required><br><br>

        <label>Subjects:</label><br>
        <input type="checkbox" id="math" name="subjects" value="Math">
        <label for="math">Math</label><br>
        <input type="checkbox" id="science" name="subjects" value="Science">
        <label for="science">Science</label><br>
        <input type="checkbox" id="history" name="subjects" value="History">
        <label for="history">History</label><br><br>

        <label for="fileUpload">Upload File (Resume/ID):</label><br>
        <input type="file" id="fileUpload" name="fileUpload"><br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
