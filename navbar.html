<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavBar</title>
    <style>
        *, html{

        }
        ul{
            list-style: none;
            display: flex;
        }
        ul li a{
            text-decoration: none;
            color: white;
            padding: 5px 6px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }
        ul li a:hover{
            color: aqua;
            font-size: 13px;
            text-decoration: solid;
            text-shadow: 0px 1px 2px #710522;
        }
        #apply-now{
            background-color: rgb(241, 91,32);
            border-radius: 0%;
        }
        #apply-now a:hover{
            font-size: 13px;
            text-decoration: none;
            text-shadow: 0px 1px 2px #710522;
        }
        .active{
            color: aqua;
            text-size: 13px;
            text-decoration: underline;
            text-shadow: #710522;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#" target="_blank">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">FAQ</a></li>
    </ul>
    
</body>
</html>
